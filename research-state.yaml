project:
  title: "Five-region livestock transfer: unified weighted MILP"
  question: "How does the normalized weighted 4:2:1 MILP trade source nitrogen resolution, source-region livestock composition, destination environment, and movement volume across EU, Australia, China, USA, and Brazil?"
  status: active
  started: "2026-08-25"
  domain: "livestock transfer optimization and reinforcement learning"

literature:
  key_papers: []
  open_problems: []
  evidence_gaps:
    - "The exact training command and checkpoint provenance for results/v9/eu are not preserved with the result files."
    - "Only one RL result and one MILP result are available; no seed-level uncertainty can be estimated."

hypotheses:
  - id: H1
    statement: "The lexicographic MILP resolves at least as much source nitrogen as RL v9 while moving fewer animals because nitrogen is its first exact objective."
    status: supported
    motivation: "RL optimizes a local weighted reward, while MILP globally locks nitrogen resolution before secondary objectives."
    parent: null
    priority: high
  - id: H2
    statement: "The MILP has lower route-structure deviation than RL v9 because route composition is explicitly optimized only by the MILP."
    status: refuted
    motivation: "The MILP minimizes route-wise L1 deviation from a learned common transfer fraction."
    parent: null
    priority: high
  - id: H3
    statement: "Environmental placement differences are conditional on the higher-priority nitrogen and structure constraints and should not be interpreted as a standalone algorithm ranking."
    status: supported
    motivation: "The two methods optimize different objective orderings, and the MILP environmental stage is time-limited."
    parent: null
    priority: high
  - id: H7
    statement: "A normalized unified 4:2:1 MILP can trade negligible source-N loss for materially better source-removal-rate proxy and destination environment score on EU."
    status: supported
    motivation: "Unlike lexicographic locks, a unified normalized objective permits explicit trade-offs while keeping all three terms comparable."
    parent: null
    priority: high
  - id: H8
    statement: "The source-removal-rate proxy remains a faithful measure of actual remaining livestock composition without an explicit minimum-retention condition."
    status: refuted
    motivation: "Nearly emptying a source makes remaining shares unstable under integer rounding even when removal rates are close."
    parent: H7
    priority: high

experiments:
  proxy_metric: "On the same EU input: normalized weighted score, source N resolved ratio, source removal-rate proxy, actual remaining-share L1, destination environment score, and animals moved."
  baseline_value: "Lexicographic EU rescored at J=3.643099"
  best_value: "Weighted 4:2:1 EU: certified J=4.706878"
  total_runs: 3
  trajectory:
    - experiment_id: "matched_analysis_001"
      hypothesis: "H1/H2/H3"
      metric_value: "MILP 99.9999953% versus RL 93.7147965% source N resolved"
      baseline: "RL v9"
      delta: "+6.2852 percentage points; 85.8831% fewer animals"
      wall_time_min: 0
      change_summary: "Recomputed matched metrics from archived raw results; no optimization run"
    - experiment_id: "weighted_4_2_1_eu_001"
      hypothesis: "H7/H8"
      metric_value: "weighted J=4.706878 at certified 0.01008% gap"
      baseline: "lexicographic solution rescored at J=3.643099"
      delta: "+29.20% J; -0.000543% N; +1550.81% environment; -77.41% proxy loss; +858.28% animals moved"
      wall_time_min: 0.3803
      change_summary: "Single normalized weighted MILP, weights 4:2:1"
    - experiment_id: "weighted_4_2_1_aus_001"
      hypothesis: "H7/H8 cross-region extension"
      metric_value: "weighted J=4.157772 at certified 0.06635% gap"
      baseline: "EU weighted formulation applied unchanged"
      delta: "N=99.58135%; proxy loss=0.007875; actual share-L1=0.006749; E=0.190269"
      wall_time_min: 52.3328
      change_summary: "Australia unlimited-time weighted MILP; independent validation passed"

outer_loop:
  cycle: 2
  last_direction: "DEEPEN"
  last_reflection: "The unified normalized 4:2:1 objective is now certified on EU and Australia. Australia does not reproduce EU's severe proxy/actual-share mismatch, suggesting the failure depends on near-depletion and inventory structure. Continue the frozen formulation on China, USA, and Brazil before changing the model."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "baselines/"
  to_human_dir: "baselines/milp/to_human/"
  paper_dir: "paper/"
